[project]
name = "mka"
version = "0.1.0"
description = "Meridian Knowledge Assistant"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv",
]

[project.scripts]
mka = "mka.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

